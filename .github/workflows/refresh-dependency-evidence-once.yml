name: Refresh dependency evidence once

on:
  push:
    branches:
      - codex/interactive-documentation-maps
    paths:
      - .github/workflows/refresh-dependency-evidence-once.yml

permissions:
  contents: write

jobs:
  refresh-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/interactive-documentation-maps

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Regenerate dependency notices and SBOMs
        run: |
          npm run notices
          npm run sbom

      - name: Commit generated evidence only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt public/third-party-notices.txt public/third-party-licenses.txt SBOM.spdx.json SBOM.production.spdx.json
          if git diff --cached --quiet; then
            echo "Dependency evidence is already current."
          else
            git commit -m "Refresh dependency evidence for security-fixed lockfile"
            git push origin HEAD:codex/interactive-documentation-maps
          fi
