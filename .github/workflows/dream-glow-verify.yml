name: Dream glow regression gate
on:
  push:
    branches: [codex/dream-glow-field-2026-09-13]
    paths:
      - app/dream*.ts
      - app/Battlefield.tsx
      - app/battlefieldScene.ts
      - app/wildlife*.ts
      - app/catalog.ts
      - tests/dream*.ts
      - tests/browser/environment-visuals.spec.ts
      - scripts/verify-dream-glow.mjs
      - package.json
      - package-lock.json
  pull_request:
    branches: [main]
    paths:
      - app/dream*.ts
      - app/Battlefield.tsx
      - app/battlefieldScene.ts
      - app/wildlife*.ts
      - app/catalog.ts
      - tests/dream*.ts
      - tests/browser/environment-visuals.spec.ts
      - scripts/verify-dream-glow.mjs
      - package.json
      - package-lock.json
      - .github/workflows/dream-glow-verify.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dream-glow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Mathematical field and rendered occlusion
        run: node scripts/verify-dream-glow.mjs
      - name: Complete non-browser gate
        run: npm run check
      - name: Existing environment browser regressions
        run: npx playwright test tests/browser/environment-visuals.spec.ts
      - name: Record checked revision
        if: always()
        run: |
          mkdir -p evidence/dream-glow
          git rev-parse HEAD > evidence/dream-glow/checked-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream-glow-verification-${{ github.sha }}
          path: |
            evidence/dream-glow
            test-results
          retention-days: 14
          if-no-files-found: error
