name: Reseal Lattice snapshot once

on:
  push:
    branches:
      - codex/interactive-documentation-maps
    paths:
      - .github/workflows/reseal-lattice-snapshot-once.yml

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out FOG OF SEA branch
        uses: actions/checkout@v4
        with:
          ref: codex/interactive-documentation-maps
          path: fog

      - name: Check out pinned Lattice owner authority
        uses: actions/checkout@v4
        with:
          repository: howardhayden/lattice
          ref: d6cc85b275e3f14163a5a547f626832fd21b27b0
          path: lattice-owner

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: fog/.node-version
          cache: npm
          cache-dependency-path: fog/package-lock.json

      - name: Install exact FOG OF SEA dependencies
        working-directory: fog
        run: npm ci

      - name: Compile and independently verify the resealed snapshot
        working-directory: fog
        env:
          LATTICE_OWNER_ROOT: ${{ github.workspace }}/lattice-owner
        run: |
          npm run lattice:compile
          npm run verify:lattice-copy

      - name: Commit governed snapshot artifacts only if changed
        working-directory: fog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/generated/lattice-copy.json app/generated/lattice-copy.runtime.json evidence/lattice/current.json evidence/lattice/index.json
          if git diff --cached --quiet; then
            echo "Lattice snapshot is already current."
          else
            git commit -m "Reseal Lattice snapshot for security-fixed validator authority"
            git push origin HEAD:codex/interactive-documentation-maps
          fi
