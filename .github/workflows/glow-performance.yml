name: Restored glow performance verification
on:
  push:
    branches: [codex/restored-glow-performance-2026-09-13]
    paths: ['app/**', 'tests/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Preserve approved baseline then apply adopted candidates
        run: |
          git apply tests/fixtures/glow-scene-repair.patch
          cp app/dreamGlowRenderer.ts app/dreamGlowBaseline.ts
          git apply --check tests/fixtures/glow-performance.patch
          git apply tests/fixtures/glow-performance.patch
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          raw=gzip.decompress(base64.b64decode(pathlib.Path('tests/fixtures/glow-performance-batch.patch.gz.b64').read_text(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='6cfc1b2bba3a6b1500deb9eb63bbc7a7582fe4e227920a5cb1523c57c1ed5cac'
          pathlib.Path('tests/fixtures/glow-performance-batch.patch').write_bytes(raw)
          PY
          git apply --check tests/fixtures/glow-performance-batch.patch
          git apply tests/fixtures/glow-performance-batch.patch
      - run: npm ci
      - name: Check source, lifetime, source pool, timing, materials, and original glow mathematics
        run: |
          npm run typecheck
          node --import tsx --test tests/dream-glow-math.test.ts tests/dream-emission.test.ts tests/dream-reflectivity.test.ts tests/dream-glow-performance.test.ts tests/dream-glow-pool.test.ts
          npm run build
      - run: npx playwright install --with-deps webkit
      - name: Compare identical actual scenes and real animation against approved renderer
        run: |
          npm run dev -- --port 4174 > /tmp/glow-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node scripts/compare-restored-glow.mjs
          node scripts/profile-motion-comparison.mjs
      - name: Preserve exact tested application source
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json
          records={}
          with zipfile.ZipFile('tested-performance-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(pathlib.Path('app').rglob('*')):
                  if not p.is_file() or p.name=='dreamGlowBaseline.ts':continue
                  raw=p.read_bytes();records[str(p)]=hashlib.sha256(raw).hexdigest();z.writestr(str(p),raw)
          pathlib.Path('test-results').mkdir(exist_ok=True)
          pathlib.Path('test-results/tested-source-sha256.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-glow-performance-${{ github.sha }}
          path: |
            test-results/
            tested-performance-source.zip
          retention-days: 14
          if-no-files-found: warn
