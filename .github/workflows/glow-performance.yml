name: Restored glow performance profile
on:
  push:
    branches: [codex/restored-glow-performance-2026-09-13]
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Restore approved application state
        run: git apply tests/fixtures/glow-scene-repair.patch
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Measure restored actual scenes
        run: |
          npm run dev -- --port 4174 > /tmp/glow-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node scripts/profile-restored-glow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-glow-profile-${{ github.sha }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
