name: NDCG reconciled verification
on:
  push:
    branches: [codex/ndcg-entity-glow-2026-09-13]
    paths: [.github/workflows/ndcg-qualify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Reconcile only the unqualified glow checkpoint and apply candidate
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = '78fd15225a763f6d535a96da2501b97e685ad6c9'
          checkpoint = '373cd8bcfbbf813a6fa4a264159a81a1d5b87c7e'
          expected = {'app/Battlefield.tsx', 'app/dreamEmission.ts', 'app/dreamGlowRenderer.ts', 'tests/dream-emission.test.ts', 'tests/dream-glow-math.test.ts'}
          assert set(git('diff', '--name-only', base, checkpoint, '--', 'app', 'tests').splitlines()) == expected
          assert not git('diff', '--name-only', checkpoint, 'HEAD', '--', 'app', 'tests'), 'New source edits require reconciliation; no overwrite performed'
          payload = ''.join(p.read_text().strip() for p in sorted(pathlib.Path('.ndcg-transport').glob('*.b64')))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a3596c33fa53332c42da4d5181a898c14c0ad91d2404e93783cb37a5b9cca97f'
          # This checkpoint explicitly labels itself unqualified. Its entire
          # commit remains in parent history; replace only these glow-owned paths.
          subprocess.run(['git', 'restore', '--source='+base, '--worktree', '--', 'app/Battlefield.tsx', 'app/dreamEmission.ts', 'tests/dream-emission.test.ts'], check=True)
          for name in ['app/dreamGlowRenderer.ts', 'tests/dream-glow-math.test.ts']:
              pathlib.Path(name).unlink()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ndcg.patch'; out.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(out)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(out)], check=True)
          PY
      - name: Commit isolated candidate while retaining checkpoint history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/Battlefield.tsx app/battlefieldScene.ts app/dreamEmission.ts app/dreamGlowMath.ts app/dreamGlowRenderer.ts app/globals.css tests/browser/environment-visuals.spec.ts tests/browser/fixtures/ndcg-glow.ts tests/browser/ndcg-glow-pixels.spec.ts tests/dream-emission.test.ts tests/dream-glow-math.test.ts tests/dream-glow-scene.test.ts tests/red-team/ndcg-glow-contract.test.ts
          git rm -r .ndcg-transport
          git commit -m 'Complete NDCG source-derived renderer candidate across all five entity classes' -m 'Replace unqualified checkpoint 373cd8b only in glow-owned paths; preserve it and the original failed implementation in history. GPU qualification is separate.'
          git push origin HEAD:codex/ndcg-entity-glow-2026-09-13
          mkdir -p evidence/ndcg-glow/ci
          git rev-parse HEAD > evidence/ndcg-glow/ci/head.txt
      - name: Install pinned dependencies and browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Static checks and focused tests
        id: static
        continue-on-error: true
        run: |
          set -o pipefail
          { npm run typecheck && npm run lint && node --import tsx --test tests/dream-emission.test.ts tests/dream-glow-math.test.ts tests/dream-glow-scene.test.ts tests/red-team/ndcg-glow-contract.test.ts && npm run test:red-team && npm run build; } 2>&1 | tee evidence/ndcg-glow/ci/static.log
      - name: GPU pixel oracle
        id: pixels
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test tests/browser/ndcg-glow-pixels.spec.ts --project=desktop-chromium --workers=1 --output=test-results/ndcg-pixels 2>&1 | tee evidence/ndcg-glow/ci/pixels.log
      - name: Application integration
        id: app
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test tests/browser/environment-visuals.spec.ts --project=desktop-chromium --workers=1 --output=test-results/ndcg-app --grep 'subjects breathe|night dream emission' 2>&1 | tee evidence/ndcg-glow/ci/app.log
      - name: Record outcomes
        if: always()
        run: |
          mkdir -p evidence/ndcg-glow/ci
          echo '{"static":"${{ steps.static.outcome }}","pixels":"${{ steps.pixels.outcome }}","app":"${{ steps.app.outcome }}"}' > evidence/ndcg-glow/ci/outcomes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndcg-renderer-evidence
          path: |
            evidence/ndcg-glow/ci/
            test-results/
          retention-days: 7
          if-no-files-found: error
      - name: Require passing candidate gates
        if: always()
        run: test '${{ steps.static.outcome }}' = success && test '${{ steps.pixels.outcome }}' = success && test '${{ steps.app.outcome }}' = success
