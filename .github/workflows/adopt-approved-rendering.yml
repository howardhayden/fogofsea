name: Integrate the user-approved rendering artifact
on:
  push:
    branches: [codex/approved-rendering-staging]
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dense-starfield-evidence-c981b6094d69e5415ab0756fce68957a6aff3ccf
          run-id: 34794716567
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-dense-stars
      - name: Copy the exact approved application, never the rejected experiment
        env:
          STAGING_SHA: ${{ github.sha }}
        run: |
          git switch --detach bd84e20cffd37ae5435bee50caab6319f50d2a7f
          python3 - <<'PY'
          import os,pathlib,zipfile,hashlib,json,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'approved-dense-stars'
          archives=list(root.rglob('tested-css-only-source.zip'))
          assert len(archives)==1, 'Exactly one selected CSS-only artifact is required'
          with zipfile.ZipFile(archives[0]) as archive:
              names=archive.namelist()
              assert len(names)==59 and len(set(names))==59
              data={}
              for name in names:
                  path=pathlib.PurePosixPath(name)
                  assert path.parts[0]=='app' and not path.is_absolute() and '..' not in path.parts
                  assert path.suffix.lower() not in ('.woff','.woff2','.ttf','.otf','.ttc')
                  data[name]=archive.read(name)
          hashes={name:hashlib.sha256(raw).hexdigest() for name,raw in sorted(data.items())}
          manifest=''.join(name+'\0'+digest+'\n' for name,digest in sorted(hashes.items()))
          expected='e5a0ea1b216ab10ada3cb875e2cdd97eb73d88f1f06006edbee78e349c0a03a4'
          assert hashlib.sha256(manifest.encode()).hexdigest()==expected, 'Does not match the approved download'
          existing={str(p) for p in pathlib.Path('app').rglob('*') if p.is_file()}
          assert existing==set(data), 'Unexpected application files need reconciliation'
          for name,raw in data.items():pathlib.Path(name).write_bytes(raw)
          changed=set(subprocess.check_output(['git','diff','--name-only','--','app'],text=True).splitlines())
          assert changed=={'app/Battlefield.tsx','app/dreamGlowRenderer.ts','app/globals.css'}, changed
          fixed={
              'package.json':'8d6ded4120bfae7a65ea29840171b94e8dce4239a837d9e25789dc7c3a6acfb7',
              'package-lock.json':'e933875b533f95c74691ed261f40cf3e3ec482ee113a6e818a458c400336cbe5',
              'vite.config.ts':'9099e9210e0dea13e84167b4295f7ee0dbb4d2e1501f12e4204cdde3b82c1b5e',
              'wrangler.jsonc':'17bd96a4b1149cda8c29468965e46b07775ed7a822b302ecc195df88bb736c88',
              'public/_headers':'ba7a019e4d30f97fa72021811f7d0a626139cf75cf1df3bbdc6c1fb8a32f4616',
              '.node-version':'08062faf0d7a2d22f5d7933c50e975dd1527034275597be7c1b3b9fd2b9d079a',
              'tsconfig.json':'ea04ea6c4417fe760db6dc0c3082bb3209da03fe603eab40ed7517f3fd38ee7e',
              '.github/workflows/main.yml':'fb9551cd3521ccfd7b1ca6bb0f2696d02e3dc98c0febcc1747edb46f875622e9',
          }
          for name,digest in fixed.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          extras=['tests/dream-glow-performance.test.ts','tests/dream-glow-pool.test.ts','tests/dream-reflectivity.test.ts','docs/design/24-APPROVED-RENDERING-RELEASE.md']
          for name in extras:
              raw=subprocess.check_output(['git','show',os.environ['STAGING_SHA']+':'+name])
              path=pathlib.Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
          evidence=pathlib.Path('evidence/releases/approved-rendering');evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'application-sha256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          (evidence/'source-identity.json').write_text(json.dumps({
              'approved_download':'FOG-OF-SEA-vscodium-dense-starfield.zip',
              'approved_download_sha256':'7a4962084de14fc2bf2fc032c7168a6cf988efd1460356476112101c18dc4dd0',
              'application_manifest_sha256':expected,
              'artifact_run':34794716567,'artifact_id':10328799946,
              'selected_source':'tested-css-only-source.zip',
              'original_glow_parent':'bd84e20cffd37ae5435bee50caab6319f50d2a7f',
              'all_59_application_files_match':True,
              'rejected_culling_and_sampling_experiments_included':False,
          },indent=2)+'\n')
          for path in (root/'test-results').rglob('*.json'):
              if path.name.startswith('tested-'):continue
              target=evidence/'dense-starfield' / path.relative_to(root/'test-results')
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(path.read_bytes())
          PY
      - run: npm ci
      - name: Check the exact integrated source
        run: npm run release:check
      - name: Commit and push only the approved integration branch
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          hashes=json.loads(pathlib.Path('evidence/releases/approved-rendering/application-sha256.json').read_text())
          for name,digest in hashes.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PY
          git config user.name 'Hayden Howard'
          git config user.email 'howardhayden@tuta.io'
          git add -- app/Battlefield.tsx app/dreamGlowRenderer.ts app/globals.css tests/dream-glow-performance.test.ts tests/dream-glow-pool.test.ts tests/dream-reflectivity.test.ts docs/design/24-APPROVED-RENDERING-RELEASE.md evidence/releases/approved-rendering
          git commit -m 'Ship approved dream glow, scene preservation, and dense-starfield smoothness' -m 'The new glow effect was indirectly recommended by ENS Mayukh Banik, who could not discern a glow effect, which told me all I needed to know.' -m 'Integrate all 59 application files byte-for-byte from the user-approved dense-starfield download: native-color shape-derived glow, side-view scaling, reflective scene preservation, reusable batched rendering, and the covered CSS fallback-star pause. Exclude the rejected star-culling and per-sample experiments. Preserve validation evidence and original release gates.'
          git push origin HEAD:refs/heads/codex/approved-rendering-release
          git rev-parse HEAD > "$RUNNER_TEMP/approved-release-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-rendering-integration
          path: |
            ${{ runner.temp }}/approved-release-commit.txt
            evidence/releases/approved-rendering/
          if-no-files-found: warn
          retention-days: 14
