name: Glow scene preservation investigation
on:
  push:
    branches: [codex/glow-scene-preservation-2026-09-13]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Compare real opaque context with RGBA context in every time of day
        run: |
          npm run dev -- --port 4174 > /tmp/fog-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node scripts/probe-glow-scene.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glow-scene-probe-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
