name: NDCG source checkpoint (not validation)
on:
  push:
    branches: [codex/ndcg-entity-glow-2026-09-13]
    paths: [.github/workflows/ndcg-workbench.yml]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package prepared source for continued local qualification
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ndcg-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/ndcg-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/ndcg-source/COMMIT"
          sha256sum "$RUNNER_TEMP/ndcg-source/source.tar.gz" > "$RUNNER_TEMP/ndcg-source/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: ndcg-source-checkpoint
          path: ${{ runner.temp }}/ndcg-source/
          retention-days: 2
          if-no-files-found: error
