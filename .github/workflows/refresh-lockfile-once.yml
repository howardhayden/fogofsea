name: Refresh dependency lockfile once

on:
  push:
    branches:
      - codex/interactive-documentation-maps
    paths:
      - .github/workflows/refresh-lockfile-once.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/interactive-documentation-maps

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconcile direct dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Advance vulnerable transitive js-yaml within its declared range
        run: npm update js-yaml --package-lock-only --ignore-scripts

      - name: Commit lockfile only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change required."
          else
            git commit -m "Refresh lockfile for security-fixed dependencies"
            git push origin HEAD:codex/interactive-documentation-maps
          fi
