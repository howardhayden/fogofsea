name: Dream glow verification workspace

on:
  push:
    branches: [codex/dream-glow-field-2026-09-13]
    paths: [.github/workflows/dream-glow-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Package exact baseline source
        run: git archive --format=tar.gz 78fd15225a763f6d535a96da2501b97e685ad6c9 > /tmp/fogofsea-source.tar.gz
      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts
      - name: Package verification dependencies only
        run: tar -czf /tmp/fogofsea-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: dream-glow-workspace
          path: |
            /tmp/fogofsea-source.tar.gz
            /tmp/fogofsea-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
