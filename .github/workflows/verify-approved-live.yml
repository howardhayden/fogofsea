name: Record approved release blocked before deployment
on:
  push:
    branches: [codex/approved-rendering-live-check]
concurrency:
  group: approved-rendering-public-verification
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  record-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the actual merge result; do not poll for an unperformed deployment
        run: |
          mkdir -p test-results
          cat > test-results/blocked-release.json <<'EOF'
          {
            "approved_commit": "0c7fea10dfdf39e0d14410ce84e1baebf6eaa9bc",
            "pull_request": 7,
            "merge_attempt": "rejected with HTTP 405",
            "reason": "Required status check browser-gate is failing",
            "browser_run": 34797938234,
            "browser_job": 103834577926,
            "browser_tests_passed": 105,
            "browser_tests_failed": 1,
            "browser_tests_skipped": 60,
            "failed_case": "mobile-chromium: actual Stars and Sky pixels form a white-dominant crystalline canopy with restrained color accents",
            "observed_pinpoints": 99,
            "required_pinpoints": "> 120",
            "main_changed_by_release": false,
            "deployment_performed": false,
            "verification_recipe_preserved_at": "826ecdf6180d08bb4739e467ff363792c10024b1"
          }
          EOF
          cat test-results/blocked-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: approved-rendering-release-blocker
          path: test-results/blocked-release.json
          retention-days: 14
