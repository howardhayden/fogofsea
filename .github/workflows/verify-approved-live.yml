name: Verify approved rendering on the public site
on:
  push:
    branches: [codex/approved-rendering-live-check]
permissions:
  contents: read
  actions: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fog-of-sea-dist-100c3e0fd65cee8f660c3c10acc341b6031fc357
          run-id: 34797938234
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-dist
      - name: Wait for the authorized merge without modifying any branch
        run: |
          found=0
          for i in $(seq 1 90); do
            git fetch --quiet origin main
            if git merge-base --is-ancestor 0c7fea10dfdf39e0d14410ce84e1baebf6eaa9bc FETCH_HEAD; then found=1; break; fi
            sleep 10
          done
          test "$found" = 1
          mkdir -p test-results
          git rev-parse FETCH_HEAD > test-results/main-commit.txt
      - name: Verify publicly served JavaScript and CSS bytes
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,time,urllib.request,urllib.parse
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'approved-dist'
          indexes=list(root.rglob('index.html'))
          assert len(indexes)==1
          dist=indexes[0].parent
          expected={p.relative_to(dist).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((dist/'assets').rglob('*')) if p.is_file() and p.suffix in ('.js','.css')}
          assert expected and any(p.endswith('.css') for p in expected)
          entries=re.findall(r'(?:src|href)="(/assets/[^"?]+\.(?:js|css))"',indexes[0].read_text())
          assert entries
          attempts=[]; verified=False
          def fetch(url):
              request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'FOG-OF-SEA-release-verification'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  assert urllib.parse.urlparse(response.url).hostname in ('fogofsea.app','www.fogofsea.app')
                  return response.read(),response.headers.get('Content-Type',''),response.headers.get('CF-Ray')
          for attempt in range(48):
              record={'attempt':attempt+1,'utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
              try:
                  html,content_type,ray=fetch('https://fogofsea.app/?approved-release=0c7fea1&probe='+str(int(time.time())))
                  text=html.decode();record['cf_ray']=ray
                  record['entry_points_match']=all(entry in text for entry in entries)
                  assert record['entry_points_match'], 'Public HTML still references a different release'
                  assets={}
                  for name,digest in expected.items():
                      raw,mime,_=fetch('https://fogofsea.app/'+name)
                      actual=hashlib.sha256(raw).hexdigest()
                      assets[name]={'expected':digest,'actual':actual,'match':actual==digest,'content_type':mime}
                  record['assets']=assets
                  verified=all(row['match'] for row in assets.values())
                  record['verified']=verified
              except Exception as error:
                  record['error']=str(error)
              attempts.append(record)
              if verified:break
              time.sleep(10)
          result={'approved_application_commit':'0c7fea10dfdf39e0d14410ce84e1baebf6eaa9bc','release_run':34797938234,'release_artifact':10330551945,'public_origin':'https://fogofsea.app','asset_count':len(expected),'verified':verified,'attempts':attempts}
          pathlib.Path('test-results/live-deployment.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'verified':verified,'asset_count':len(expected),'last_attempt':attempts[-1]},indent=2))
          assert verified, 'Public deployment did not match the approved release during this verification window'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-rendering-public-deployment
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
